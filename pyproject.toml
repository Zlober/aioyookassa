[project]
name = "aioyookassa"
version = "0.1.8"
description = "Asynchronous wrapper to interact with yookassa.ru API"
authors = [{ name = "Marple" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13"

keywords = [
    "yookassa",
    "asyncio",
    "aiohttp",
    "pydantic",
    "aioyookassa"
]

classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.11.5",
    "aiohttp>=3.8.1",
]

[project.urls]
Repository = "https://github.com/marple-git/aioyookassa"
Documentation = "https://aioyookassa.readthedocs.io/en/latest/"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
    "aioresponses>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["aioyookassa"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
